<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFA PRO MAX License System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
display:flex;
height:100vh;
color:white;
}

/* LEFT PANEL */
.panel{
width:30%;
background:#111827;
padding:15px;
overflow:auto;
}

input,button{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

button{
background:#38bdf8;
font-weight:bold;
cursor:pointer;
}

/* RIGHT PREVIEW */
.preview{
width:70%;
display:flex;
align-items:center;
justify-content:center;
}

/* CARD */
.card{
width:1050px;
height:670px;
background:white;
color:black;
border-radius:25px;
overflow:hidden;
transform:scale(0.55);
box-shadow:0 20px 60px rgba(0,0,0,0.5);
position:relative;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#0ea5e9,#22c55e);
padding:18px;
text-align:center;
color:white;
font-weight:bold;
letter-spacing:1px;
}

/* BODY */
.content{
display:flex;
padding:20px;
gap:20px;
}

/* PHOTO */
.photo{
width:180px;
height:220px;
border-radius:12px;
overflow:hidden;
background:#ddd;
}
.photo img{width:100%;height:100%;object-fit:cover}

/* INFO */
.info{
flex:1;
font-size:18px;
}

/* LOGO */
.logo{
width:120px;
}

/* QR */
.qr{
position:absolute;
bottom:15px;
right:15px;
}
</style>
</head>

<body>

<div class="panel">

<h2>⚽ FIFA PRO MAX</h2>

<input id="fn" placeholder="First Name">
<input id="ln" placeholder="Last Name">
<input id="dob" type="date">
<input id="cert" placeholder="Certificate No">
<input id="season" placeholder="Season">
<input id="club" placeholder="Club">

<input type="file" id="photo">
<input type="file" id="logo">

<button onclick="createPlayer()">💾 Save Player</button>
<button onclick="loadPlayers()">📥 Load Players</button>
<button onclick="updateCard()">🔄 Update Card</button>
<button onclick="exportPNG()">PNG</button>
<button onclick="exportPDF()">PDF</button>

<div id="list"></div>

</div>

<div class="preview">

<div class="card" id="card">

<div class="header">OFFICIAL FEDERATION LICENSE</div>

<div class="content">

<div>
<div class="photo"><img id="pimg"></div>
</div>

<div class="info">
<h2 id="name">PLAYER NAME</h2>
<p id="bd"></p>
<p id="cc"></p>
<p id="ss"></p>
<p id="cl"></p>
</div>

<div>
<img id="limg" class="logo">
</div>

</div>

<div id="qrcode" class="qr"></div>

</div>

</div>

<script>
const supabase = window.supabase.createClient(
"YOUR_SUPABASE_URL",
"YOUR_SUPABASE_ANON_KEY"
);

/* IMAGE */
function toBase64(file){
return new Promise(r=>{
let fr=new FileReader();
fr.onload=()=>r(fr.result);
fr.readAsDataURL(file);
});
}

photo.onchange=e=>toBase64(e.target.files[0]).then(x=>pimg.src=x);
logo.onchange=e=>toBase64(e.target.files[0]).then(x=>limg.src=x);

/* CARD UPDATE */
function updateCard(){
name.innerText = fn.value+" "+ln.value;
bd.innerText = "DOB: "+dob.value;
cc.innerText = "CERT: "+cert.value;
ss.innerText = "SEASON: "+season.value;
cl.innerText = "CLUB: "+club.value;
}

/* SAVE PLAYER */
async function createPlayer(){

let photo64 = await toBase64(photo.files[0]);
let logo64 = await toBase64(logo.files[0]);

let { data } = await supabase.from("players").insert([{
first_name:fn.value,
last_name:ln.value,
dob:dob.value,
cert_number:cert.value,
season:season.value,
club:club.value,
photo:photo64,
logo:logo64
}]).select();

generateQR(data[0].id);
alert("Player saved ✔");
}

/* LOAD */
async function loadPlayers(){
let { data } = await supabase.from("players").select("*");

list.innerHTML="";

data.forEach(p=>{
let div=document.createElement("div");
div.style.background="#1f2937";
div.style.margin="5px";
div.style.padding="10px";
div.style.borderRadius="8px";
div.innerHTML=`
<b>${p.first_name} ${p.last_name}</b><br>
${p.cert_number}
`;
list.appendChild(div);
});
}

/* QR SYSTEM */
function generateQR(id){
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"), {
text: window.location.href + "player.html?id=" + id,
width:80,
height:80
});
}

/* EXPORT */
function exportPNG(){
html2canvas(card).then(c=>{
let a=document.createElement("a");
a.download="player-card.png";
a.href=c.toDataURL();
a.click();
});
}

function exportPDF(){
html2canvas(card).then(c=>{
const img=c.toDataURL();
const { jsPDF } = window.jspdf;
let pdf=new jsPDF("landscape","mm",[88,56]);
pdf.addImage(img,"PNG",0,0,88,56);
pdf.save("player.pdf");
});
}
// LICENSE GENERATOR (FINAL BOSS CORE)
function generateLicense(){
return "FIFA-" + new Date().getFullYear() + "-" +
Math.random().toString(36).substring(2,8).toUpperCase();
}

// SAVE PLAYER (UPGRADED)
async function savePlayer(){

const photo64 = await toBase64(photo.files[0]);
const logo64 = await toBase64(logo.files[0]);
const license = generateLicense();

const { data } = await supabase.from("players").insert([{
first_name: fn.value,
last_name: ln.value,
dob: dob.value,
cert_number: cert.value,
season: season.value,
club: club.value,
position: position.value,
photo: photo64,
logo: logo64,
status: "active"
}]).select();

// create license entry
await supabase.from("licenses").insert([{
player_id: data[0].id,
license_code: license
}]);

generateQR(data[0].id);
alert("FINAL BOSS PLAYER CREATED ✔");
}  
</script>

</body>
</html>

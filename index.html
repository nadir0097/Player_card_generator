<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIFA SaaS License System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#0b1220;
color:white;
}

.panel{
width:30%;
padding:20px;
background:#111827;
overflow:auto;
}

.preview{
width:70%;
display:flex;
align-items:center;
justify-content:center;
}

input,button{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
}

button{
background:#38bdf8;
font-weight:bold;
cursor:pointer;
}

.card{
width:1050px;
height:670px;
background:white;
color:black;
border-radius:20px;
transform:scale(0.6);
overflow:hidden;
}
.header{
background:linear-gradient(90deg,#0ea5e9,#22c55e);
padding:20px;
text-align:center;
color:white;
font-weight:bold;
}
.content{
display:flex;
padding:20px;
}
.photo{
width:180px;
height:220px;
background:#ddd;
border-radius:10px;
overflow:hidden;
}
.photo img{width:100%;height:100%;object-fit:cover}
.logo{width:120px}
</style>
</head>

<body>

<div class="panel">
<h2>⚽ FIFA SaaS System</h2>

<input id="fn" placeholder="First Name">
<input id="ln" placeholder="Last Name">
<input id="dob" type="date">
<input id="cert" placeholder="Certificate No">
<input id="season" placeholder="Season">

<input type="file" id="photo">
<input type="file" id="logo">

<button onclick="savePlayer()">💾 Save to Cloud</button>
<button onclick="loadPlayers()">📥 Load Players</button>
<button onclick="updateCard()">🔄 Update Preview</button>
<button onclick="downloadPNG()">PNG</button>
<button onclick="downloadPDF()">PDF</button>

<div id="list"></div>
</div>

<div class="preview">
<div class="card" id="card">

<div class="header">FIFA-LEVEL LICENSE SYSTEM</div>

<div class="content">

<div class="photo"><img id="pimg"></div>

<div style="flex:1;padding-left:20px;">
<h2 id="name">PLAYER NAME</h2>
<p id="bd"></p>
<p id="cc"></p>
<p id="ss"></p>
</div>

<div><img id="limg" class="logo"></div>

</div>

</div>
</div>

<script>
/* =========================
   SUPABASE CONFIG
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   CARD LOGIC
========================= */

function updateCard(){
name.innerText = fn.value + " " + ln.value;
bd.innerText = "DOB: " + dob.value;
cc.innerText = "CERT: " + cert.value;
ss.innerText = "SEASON: " + season.value;
}

/* IMAGE -> BASE64 */
function toBase64(file){
return new Promise((resolve)=>{
let r = new FileReader();
r.onload = ()=>resolve(r.result);
r.readAsDataURL(file);
});
}

photo.onchange = e=>{
toBase64(e.target.files[0]).then(r=>pimg.src=r);
}

logo.onchange = e=>{
toBase64(e.target.files[0]).then(r=>limg.src=r);
}

/* =========================
   SAVE TO SUPABASE
========================= */
async function savePlayer(){

let photo64 = await toBase64(photo.files[0]);
let logo64 = await toBase64(logo.files[0]);

await client.from("players").insert([{
first_name:fn.value,
last_name:ln.value,
dob:dob.value,
cert_number:cert.value,
season:season.value,
photo:photo64,
logo:logo64
}]);

alert("Saved to cloud ✅");
}

/* =========================
   LOAD PLAYERS
========================= */
async function loadPlayers(){

let { data } = await client.from("players").select("*");

list.innerHTML="";

data.forEach(p=>{
let div=document.createElement("div");
div.style.background="#1f2937";
div.style.margin="5px";
div.style.padding="10px";
div.style.borderRadius="8px";

div.innerHTML=`
<b>${p.first_name} ${p.last_name}</b><br>
${p.cert_number}
`;

list.appendChild(div);
});
}

/* =========================
   EXPORT
========================= */

function downloadPNG(){
html2canvas(card).then(c=>{
let a=document.createElement("a");
a.download="card.png";
a.href=c.toDataURL();
a.click();
});
}

function downloadPDF(){
html2canvas(card).then(c=>{
const img=c.toDataURL("image/png");
const { jsPDF } = window.jspdf;
let pdf=new jsPDF("landscape","mm",[88,56]);
pdf.addImage(img,"PNG",0,0,88,56);
pdf.save("card.pdf");
});
}
</script>

</body>
</html>
